function review(k){const{B}=calc(),m=M[k],isIn=k==='in',rows=[],errs=[];

const cur=(B[pid]||{q:0}).q;if(!isIn&&n>cur+1e-9)errs.push(`${p.name}: เบิก ${fmt(n)} เกินคงเหลือ ${fmt(cur)}`);rows.push({pid,name:p.name,unit:p.unit,qty:r3(n),cur})}

const id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

async function deleteSelected(){

const ids=[...selectedProducts].filter(id=>S.prods.some(p=>p.id===id));
if(!ids.length)return toast('กรุณาเลือกสินค้าที่ต้องการลบ',1);
const names=ids.map(id=>S.prods.find(p=>p.id===id)?.name||id);
if(!confirm(`ยืนยันลบสินค้า ${ids.length} รายการ?\n\n${names.slice(0,12).join('\n')}${names.length>12?'\n… และอีก '+(names.length-12)+' รายการ':''}\n\nการลบนี้จะลบเอกสารสินค้าใน products เท่านั้น ประวัติรับเข้า/เบิกออกเดิมจะไม่ถูกลบ`))return;
busy=true;let deleted=0;
try{for(let i=0;i<ids.length;i+=400){const batch=db.batch();ids.slice(i,i+400).forEach(id=>batch.delete(db.collection('products').doc(id)));await batch.commit();deleted+=Math.min(400,ids.length-i)}
selectedProducts.clear();toast('ลบสินค้า '+deleted+' รายการสำเร็จ');
}catch(e){toast('ลบไม่สำเร็จหลังดำเนินการ '+deleted+' รายการ: '+(e.message||e.code)+' · ตรวจสอบ Firebase Security Rules',1)}
finally{busy=false;render()}
}
function similarName(a,b){const norm=x=>String(x||'').toLowerCase().replace(/[\s\-_.,()]/g,'').replace(/(สด|แช่แข็ง|แช่เย็น)$/,'');const x=norm(a),y=norm(b);if(!x||!y||x===y)return false;let same=0;for(const c of x)if(y.includes(c))same++;const score=same/Math.max(x.length,y.length);return score>=0.72||x.includes(y)||y.includes(x)}
