.report-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.report-grid .card{margin-bottom:0;min-width:0}.rbar{margin:13px 0}.rbar-head{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px}.rbar-head span{overflow-wrap:anywhere}.rbar-head b{white-space:nowrap}.rbar-track{height:9px;background:#f3f4f6;border-radius:99px;overflow:hidden}.rbar-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f59e0b,#fbbf24)}.report-grid .card:nth-child(4) .rbar-track i{background:linear-gradient(90deg,#ef4444,#fca5a5)}.rlist-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.rlist-row:last-child{border-bottom:0}.rlist-row span{min-width:0}.rlist-row b{display:block;font-size:13px}.rlist-row small{display:block;color:var(--mu);font-size:11px}.rlist-row strong{font-size:12px;white-space:nowrap}.warn-txt{color:#b45309}.legend{display:flex;gap:16px;font-size:12px;color:var(--mu);margin:4px 0 12px}.legend span{display:flex;align-items:center;gap:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}.lg-in,.move-in{background:#10b981}.lg-out,.move-out{background:#ef4444}.move-chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;min-height:170px}.move-day{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}.move-bars{height:100px;width:100%;display:flex;align-items:end;justify-content:center;gap:4px;border-bottom:1px solid var(--ln)}.move-bars i{display:block;width:30%;max-width:20px;min-height:0;border-radius:4px 4px 0 0}.move-day small{font-size:10px;white-space:nowrap}.move-day span{font-size:9px;color:var(--mu);text-align:center;line-height:1.3}.report-total{font-size:25px;font-weight:700;color:#b91c1c;margin:8px 0}.report-total small{font-size:12px;font-weight:400;color:var(--mu)}.month-chart{height:175px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end}.month-col{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:5px;min-width:0}.month-col b{font-size:10px;color:var(--mu);white-space:nowrap}.month-track{height:110px;width:100%;display:flex;align-items:end;justify-content:center;background:#f9fafb;border-radius:7px 7px 0 0;overflow:hidden}.month-track i{display:block;width:65%;background:#f59e0b;border-radius:5px 5px 0 0}.month-col small{font-size:11px}.report-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.report-stats div{padding:12px;border-radius:12px;background:#fffbeb}.report-stats span{display:block;font-size:12px;color:var(--mu)}.report-stats b{display:block;font-size:18px}@media(max-width:760px){.report-grid{grid-template-columns:1fr}.move-chart{gap:4px}.move-day span{font-size:8px}.month-col b{font-size:9px}.report-grid .card{padding:16px}}

<script>
const KEY='smart-stock-v2';
const seed=()=>({seq:100,br:'ร้านหลัก',branches:['ร้านหลัก'],
 sups:[{id:1,name:'ซีพี',code:'CP',days:[],time:'12:00'},{id:2,name:'แม็คโคร',code:'MK',days:[],time:'12:00'}],
 products:[{id:1,br:'ร้านหลัก',sku:'FD-MK-001',cat:'นม/เครื่องดื่ม',name:'นมสดพาสเจอร์ไรส์ (เมจิ)',size:'2 ลิตร',sup:2,cost:95,qty:12,unit:'แกลลอน',min:5},
  {id:2,br:'ร้านหลัก',sku:'BE-CP-001',cat:'กาแฟ',name:'เมล็ดกาแฟอาราบิก้า (เนสกาแฟ)',size:'500g',sup:1,cost:175,qty:5,unit:'ถุง',min:5}],
 orders:[],moves:[],tx:[]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.products)S=seed();
S.tx=(S.tx||[]).map(x=>({...x,approval:x.approval||'approved'}));S.products=(S.products||[]).map(x=>({...x,approval:x.approval||'approved'}));S.expenseRequests=S.expenseRequests||[];S.docs=S.docs||[];S.pin=S.pin||'123456';S.users=S.users||[];S.expCats=S.expCats||['ค่าน้ำ','ค่าไฟฟ้า','ค่าแรง','ค่าเดินทาง','ค่าอุปกรณ์','ค่าเช่า','ค่าอินเทอร์เน็ต','อื่นๆ'];S.receipts=S.receipts||[];S.deleteRequests=S.deleteRequests||[];S.stockEditRequests=S.stockEditRequests||[];S.navStyle=S.navStyle||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));if(window.ssScheduleSync)window.ssScheduleSync()}catch(e){toast('บันทึกในเบราว์เซอร์ไม่ได้ กรุณาส่งออกข้อมูลสำรอง')}};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m2=n=>'฿'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const B=a=>a.filter(x=>x.br==S.br);
const P=id=>S.products.find(p=>p.id==id),SP=id=>S.sups.find(s=>s.id==id);
const uid=()=>S.seq++;
const DAYS=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const MON=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const z=n=>String(n).padStart(2,'0');
const fd=t=>{const d=new Date(t);return `${d.getDate()} ${MON[d.getMonth()].slice(0,3)}. ${d.getFullYear()+543} ${z(d.getHours())}:${z(d.getMinutes())}`};
const low=p=>p.qty<=p.min;
const poNo=o=>'PO-'+String(o.id).padStart(4,'0');
let tab='stock',fs='all',q='',onlyLow=false,pv=null;
let currentUser=null, editingUserCode='';
const TABS=[['stock','📦','สต๊อก'],['order','🚚','สั่งของ'],['mv','📤','เบิกออก'],['hist','🕘','ประวัติ'],['cash','💵','รายจ่าย'],['rep','📊','รายงาน']];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
function tick(){const d=new Date();const mobile=window.matchMedia('(max-width:600px)').matches;$('#dt').textContent=mobile?`${d.getDate()} ${MON[d.getMonth()].slice(0,3)} ${d.getFullYear()+543}`:`${DAYS[d.getDay()].replace('วัน','').slice(0,10)} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()+543}`;$('#tm').textContent=`${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`}
setInterval(tick,1000);

function supState(s){
 if(!s.days.length)return {t:'ไม่กำหนดรอบ',c:'',d:'ไม่กำหนดรอบ (สั่งได้ตลอด)',dot:''};
 const n=new Date(),hm=z(n.getHours())+':'+z(n.getMinutes()),txt='สั่งได้วัน'+s.days.map(d=>DAYS[d]).join(', ')+' ก่อน '+s.time+' น.';
 if(s.days.includes(n.getDay()))return hm<s.time?{t:'เปิดรับสั่งวันนี้',c:'o',d:txt,dot:'#10b981'}:{t:'ปิดรับแล้ว',c:'c',d:txt,dot:'#ef4444'};
 for(let i=1;i<=7;i++){const d=(n.getDay()+i)%7;if(s.days.includes(d))return {t:'ยังไม่ถึงรอบ (ถัดไปวัน'+DAYS[d]+')',c:'',d:txt,dot:'#9ca3af'}}

// Compact the page heading and stock controls after the user starts scrolling.
(function(){
  let ticking=false;
  const updateScrollState=()=>{document.body.classList.toggle('scrolled',window.scrollY>24);ticking=false;};
  window.addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(updateScrollState)}},{passive:true});
  function placeStockFilters(){
    const nav=document.getElementById('nav');
    const filters=document.querySelector('.stock-filter-sticky');
    const app=document.getElementById('app');
    if(!nav||!filters||!app){document.documentElement.style.removeProperty('--stock-filter-top');return;}
    const navRect=nav.getBoundingClientRect();
    const top=Math.max(0,navRect.bottom);
    // Reserve enough space for the fixed header + main navigation on EVERY tab.
    // The filter spacer then reserves its own height on the stock tab, preventing overlap.
    app.style.setProperty('padding-top',(top+14)+'px','important');
    document.documentElement.style.setProperty('--stock-filter-top',top+'px');
    let spacer=document.getElementById('stockFilterSpacer');
    if(filters && filters.parentNode){
      if(!spacer){spacer=document.createElement('div');spacer.id='stockFilterSpacer';filters.parentNode.insertBefore(spacer,filters.nextSibling);}
      spacer.style.height=filters.offsetHeight+'px';
      spacer.style.marginBottom='10px';
    }
  }
  const refreshFilters=()=>requestAnimationFrame(placeStockFilters);
  new MutationObserver(refreshFilters).observe(document.getElementById('app'),{childList:true,subtree:true});
  window.addEventListener('resize',refreshFilters,{passive:true});
  window.addEventListener('scroll',refreshFilters,{passive:true});
  updateScrollState();refreshFilters();
})();

 try{if(!firebase.apps.length)firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async u=>{document.getElementById('ssUser').textContent=u?'เข้าสู่ระบบแล้ว: '+u.email:'ยังไม่ได้เข้าสู่ระบบ';if(unsub){unsub();unsub=null}if(!u){syncState.textContent='สถานะซิงก์: ยังไม่ได้เข้าสู่ระบบ';return}syncState.textContent='สถานะซิงก์: กำลังเชื่อมต่อ...';const ref=db.collection('smartStockData').doc(u.uid);try{const initial=await ref.get();if(!initial.exists){await ref.set({state:S,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:u.uid,schema:1});lastCloudJson=JSON.stringify(S);say('สร้างข้อมูล Cloud จากเครื่องนี้แล้ว')}else{const cloud=initial.data()?.state;if(cloud&&Array.isArray(cloud.products)){const cj=JSON.stringify(cloud),lj=localStorage.getItem('smart-stock-v2')||'';lastCloudJson=cj;if(lj!==cj){localStorage.setItem('smart-stock-v2',cj);location.reload();return}}}unsub=ref.onSnapshot(snap=>{if(!snap.exists)return;const cloud=snap.data()?.state;if(!cloud||!Array.isArray(cloud.products))return;const json=JSON.stringify(cloud);if(json===lastCloudJson)return;lastCloudJson=json;applyingCloud=true;try{localStorage.setItem('smart-stock-v2',json);syncState.textContent='สถานะซิงก์: มีข้อมูลใหม่ กำลังโหลดหน้าใหม่';setTimeout(()=>location.reload(),250);}finally{applyingCloud=false}});syncState.textContent='สถานะซิงก์: เชื่อมต่อแล้ว';}catch(e){syncState.textContent='สถานะซิงก์: เชื่อมต่อไม่สำเร็จ';say('ซิงก์ไม่สำเร็จ: '+e.message+' ตรวจสอบ Firestore และ Rules')}});}catch(e){say('เริ่มต้น Firebase ไม่สำเร็จ: '+e.message)}
 window.ssScheduleSync=()=>{if(applyingCloud||!auth?.currentUser||!db)return;clearTimeout(writeTimer);writeTimer=setTimeout(async()=>{try{const u=auth.currentUser;if(!u)return;const json=JSON.stringify(S);if(json===lastCloudJson)return;await db.collection('smartStockData').doc(u.uid).set({state:S,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:u.uid,schema:1});lastCloudJson=json;syncState.textContent='สถานะซิงก์: ซิงก์ล่าสุดแล้ว '+new Date().toLocaleTimeString()}catch(e){syncState.textContent='สถานะซิงก์ผิดพลาด: '+e.message}},800)};
 document.getElementById('ssCloudBtn').onclick=()=>dlg.showModal();document.getElementById('ssClose').onclick=()=>dlg.close();
 document.getElementById('ssLogin').onclick=async()=>{try{await auth.signInWithEmailAndPassword(document.getElementById('ssEmail').value.trim(),document.getElementById('ssPass').value);say('เข้าสู่ระบบ Firebase แล้ว')}catch(e){say('เข้าสู่ระบบไม่สำเร็จ: '+e.message)}};

 document.getElementById('ssBackup').onclick=()=>{try{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SmartStock_local_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);say('ดาวน์โหลดข้อมูลสำรองจากเครื่องนี้แล้ว เก็บไฟล์ไว้ก่อนซิงก์')}catch(e){say('สำรองไม่สำเร็จ: '+e.message)}};
 document.getElementById('ssUpload').onclick=async()=>{const u=auth&&auth.currentUser;if(!u){say('กรุณาเข้าสู่ระบบ Firebase ก่อน');return}if(!confirm('จะส่งข้อมูลจากเครื่องนี้ขึ้น Firebase หากมีข้อมูล Cloud เดิม จะถูกแทนที่ โปรดดาวน์โหลดไฟล์สำรองก่อน ยืนยันหรือไม่?'))return;
 try{const ref=db.collection('smartStockData').doc(u.uid),old=await ref.get();if(old.exists&&!confirm('พบข้อมูลเดิมบน Firebase การดำเนินการนี้จะแทนที่ข้อมูล Cloud ทั้งหมด ดำเนินการต่อหรือไม่?'))return;await ref.set({state:S,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:u.uid,schema:1});say('ส่งข้อมูลขึ้น Firebase สำเร็จ')}catch(e){say('ส่งข้อมูลไม่สำเร็จ: '+e.message+' ตรวจสอบ Firestore Database และ Security Rules') }};
 document.getElementById('ssDownload').onclick=async()=>{const u=auth&&auth.currentUser;if(!u){say('กรุณาเข้าสู่ระบบ Firebase ก่อน');return}if(!confirm('การโหลดจะแทนที่ข้อมูลในเครื่องนี้ โปรดดาวน์โหลดไฟล์สำรองก่อน ยืนยันหรือไม่?'))return;
 try{const snap=await db.collection('smartStockData').doc(u.uid).get();if(!snap.exists){say('ไม่พบข้อมูล Cloud ข้อมูลในเครื่องไม่เปลี่ยนแปลง');return}const cloud=snap.data();if(!cloud||!cloud.state||!Array.isArray(cloud.state.products)){say('รูปแบบข้อมูล Cloud ไม่ถูกต้อง ข้อมูลในเครื่องไม่เปลี่ยนแปลง');return}if(!confirm('พบข้อมูล Cloud ต้องการแทนที่ข้อมูลในเครื่องนี้หรือไม่?'))return;localStorage.setItem('smart-stock-v2',JSON.stringify(cloud.state));location.reload()}catch(e){say('โหลดข้อมูลไม่สำเร็จ: '+e.message+' ตรวจสอบ Firestore Database และ Security Rules') }};
