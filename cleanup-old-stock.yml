name: Sapparos Stock - cleanup old history

on:
  schedule:
    # 02:00 Asia/Bangkok daily (19:00 UTC on the previous day)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --omit=dev
      - name: Clean old Firestore history safely
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run cleanup

